# GeoCode's Python environment: what it holds, from conda-forge alone. After a change, run
# scripts/stage-python.sh --lock to resolve pixi.lock for both platforms again.

[workspace]
name = "geocode-python"
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64"]

[dependencies]
python = "3.13.*"
pip = "*"

# GDAL with its Python interface and command-line tools, and every driver conda-forge keeps apart as a plugin, so no
# format GeoAgent meets is left out. Not the ADBC one, which conda-forge builds for macOS alone.
gdal = "*"
libgdal-arrow-parquet = "*"
libgdal-fits = "*"
libgdal-grib = "*"
libgdal-hdf4 = "*"
libgdal-hdf5 = "*"
libgdal-jp2openjpeg = "*"
libgdal-kea = "*"
libgdal-netcdf = "*"
libgdal-pdf = "*"
libgdal-pg = "*"
libgdal-postgisraster = "*"
libgdal-tiledb = "*"
libgdal-xls = "*"

earthengine-api = "*"
# 1.83 or later: older ones warn at every import of ee, and Google Cloud's Python packages require it from April 2027.
grpcio = ">=1.83"
geedim = ">=2.0"
# Whole, with mapclassify's classification schemes for plot() and folium's interactive maps for explore().
geopandas = ">=1.0"
shapely = "*"
pyproj = "*"
pyogrio = "*"
rasterio = "*"
# Zonal statistics of a raster over vector features.
rasterstats = "*"
rioxarray = "*"
xarray = "*"
netcdf4 = "*"
numpy = "*"
pandas = "*"
# GeoParquet and Arrow, on the Arrow library GDAL's Parquet driver already brings.
pyarrow = "*"
scipy = "*"
statsmodels = "*"
# Spatial weights and spatial autocorrelation, from PySAL.
libpysal = "*"
esda = "*"
# OpenBLAS rather than Intel's much larger MKL, Windows's otherwise.
libblas = { version = "*", build = "*openblas" }
matplotlib-base = "*"
# Maps in a projection, with graticules and coastlines.
cartopy = "*"
# Perceptually uniform, colour-blind friendly scientific colormaps, and ready-made palettes such as ColorBrewer's.
cmcrameri = "*"
palettable = "*"
openpyxl = "*"
requests = "*"
# Searching STAC catalogs of imagery, such as Planetary Computer and Earth Search.
pystac-client = "*"

# The one package from PyPI, as conda-forge has none: frykit's graticule ticks, scale bars, north arrows, frames and
# insets for cartopy maps. A pure Python wheel whose dependencies all come from conda-forge above, so it brings no
# native library of its own. Without its [data] extra, whose Chinese boundaries come from map services' APIs.
[pypi-dependencies]
frykit = "*"
