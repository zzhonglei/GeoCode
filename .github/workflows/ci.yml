# The checks every pull request and every push to main pass on both platforms GeoCode ships for: type checks, lint
# and the unit suites. The suites on real software (QGIS, Earth Engine, the installed environment) and the checks of
# the packaged app need what a runner lacks, and stay with the maintainer.
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch makes the older run moot.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    name: check (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            label: macOS
          # windows-latest has a Visual Studio that node-gyp, which Electron's native modules build with, does not find.
          - os: windows-2022
            label: Windows
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # own-anti-slop.mjs tells GeoCode's files in desktop/ from upstream's by this branch.
      - name: Fetch chamber-upstream
        run: git fetch --depth=1 origin chamber-upstream:chamber-upstream

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: desktop/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install kernel dependencies
        working-directory: kernel
        run: bun install --frozen-lockfile

      - name: Install geoengine dependencies
        working-directory: geoengine
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Type check kernel
        working-directory: kernel
        run: bun run typecheck

      - name: Type check geoengine
        working-directory: geoengine
        run: bun run typecheck

      - name: Type check desktop
        working-directory: desktop
        run: bun run type-check

      - name: Lint desktop
        working-directory: desktop
        run: bun run lint

      - name: Anti-slop on GeoCode's desktop files
        run: node scripts/own-anti-slop.mjs

      # Exit 3, a suite not run, fails the job too: these suites need nothing a runner lacks.
      - name: Unit tests
        run: node scripts/test.mjs kernel ui web electron geoengine scripts
